spring.application.name=medication-registry

spring.datasource.url=jdbc:mariadb://localhost:3306/medication_registry
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

alims.api.url=https://api.alims.gov.rs/RegistarLekovaHumanaMedicinaREST/registarlekovahumanamedicina

medication.error=0.8
medication.days.margin=5

alims.sync-cron=0 0 3 * * *

security.jwt.secret=${JWT_SECRET:ovo-je-samo-za-razvoj-promeni-me-1234567890}

admin.default.username=${ADMIN_USERNAME:admin}
admin.default.password=${ADMIN_PASSWORD:admin123}

security.jwt.ttl-hours=8